<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E2D5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Work Schedule">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Work Schedule — Nima & Dorsa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;min-height:100vh;min-height:100dvh;overflow:hidden}

/* ══ LOCK SCREEN ══ */
#lockScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:#fff}
.blob-area{position:relative;height:42%;background:#F5C842;overflow:hidden;flex-shrink:0}
.blob-purple{position:absolute;top:-15%;right:-10%;width:55%;padding-top:55%;background:#5B5BD6;border-radius:50%}
.blob-yellow2{position:absolute;bottom:-30%;left:-8%;width:50%;padding-top:50%;background:#F5C842;border-radius:50%}
.icon-card{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);width:64px;height:64px;background:#fff;border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,0.13);display:flex;align-items:center;justify-content:center;font-size:32px;z-index:5}
.form-area{flex:1;background:#fff;padding:52px 32px 32px;display:flex;flex-direction:column;align-items:center;overflow:auto}
.app-title{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:28px}
.field-group{width:100%;margin-bottom:14px}
.field-label{font-size:12px;color:#888;margin-bottom:6px;font-weight:500}
.field-input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #ebebeb;font-size:15px;color:#1a1a1a;background:#fafafa;outline:none;transition:border-color .2s}
.field-input:focus{border-color:#5B5BD6}
.pw-wrap{position:relative;width:100%;margin-bottom:24px}
.pw-wrap input{width:100%;padding:14px 44px 14px 16px;border-radius:14px;border:1.5px solid #ebebeb;font-size:15px;color:#1a1a1a;background:#fafafa;outline:none;transition:border-color .2s}
.pw-wrap input:focus{border-color:#5B5BD6}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;font-size:18px;color:#bbb;padding:4px}
.login-btn{width:100%;padding:15px;border-radius:14px;border:none;background:#1E2D5A;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .15s}
.login-btn:active{opacity:0.85}
.lock-err{color:#e24b4a;font-size:13px;margin-top:10px;min-height:18px;text-align:center}

/* ══ MAIN APP ══ */
#mainApp{display:none;position:fixed;inset:0;flex-direction:column;background:#f8f8f8}
.topbar{background:#fff;border-bottom:1px solid #f0f0f0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top))}
.topbar h1{font-size:17px;font-weight:700;color:#1a1a1a}
.topbar-sub{font-size:11px;color:#bbb}
.main-content{flex:1;overflow-y:auto;padding:14px 14px 0;-webkit-overflow-scrolling:touch}
.bottom-nav{background:#fff;border-top:1px solid #f0f0f0;display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom));flex-shrink:0}
.nb{flex:1;padding:10px 0 6px;border:none;background:transparent;cursor:pointer;font-size:10px;color:#bbb;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.active{color:#1E2D5A}

/* ══ SECTIONS ══ */
.section{display:none}.section.active{display:block}

/* ══ STATS ══ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:12px;border:0.5px solid #f0f0f0;text-align:center}
.stat-l{font-size:10px;color:#aaa;margin-bottom:4px;font-weight:500}
.stat-v{font-size:22px;font-weight:700}
.nv{color:#1E2D5A}.dv{color:#C05A1F}

/* ══ LEGEND ══ */
.legend{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#777}
.ld{width:9px;height:9px;border-radius:50%}

/* ══ CALENDAR NAV ══ */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav button{width:32px;height:32px;border-radius:50%;border:1px solid #eee;background:#fff;font-size:17px;cursor:pointer;color:#333;display:flex;align-items:center;justify-content:center}
.month-t{font-size:16px;font-weight:700;color:#1a1a1a}

/* ══ CALENDAR GRID ══ */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:14px}
.dh{text-align:center;font-size:10px;color:#bbb;padding:3px 0;font-weight:600}
.dc{min-height:52px;border-radius:8px;padding:3px 2px;background:#fff;border:0.5px solid #f0f0f0;display:flex;flex-direction:column;align-items:center}
.dc.other{background:#f7f7f7;opacity:0.4}
.dc.today .dn{background:#1E2D5A;color:#fff;border-radius:50%}
.dn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-bottom:2px}
.pill{font-size:7px;font-weight:700;padding:1px 3px;border-radius:3px;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:1px}
.np{background:#EEF2FF;color:#3D5FBF}
.dp{background:#FFF0E6;color:#C05A1F}
.op{background:#EDFAF3;color:#1A7A48}

/* ══ SHIFT LIST ══ */
.section-lbl{font-size:12px;color:#aaa;font-weight:600;margin-bottom:8px;letter-spacing:.04em}
.shift-list{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.si{background:#fff;border-radius:14px;padding:12px 14px;border:0.5px solid #f0f0f0;display:flex;align-items:center;gap:10px}
.si-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ni-bg{background:#EEF2FF}.di-bg{background:#FFF0E6}.oi-bg{background:#EDFAF3}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sdate{font-size:11px;color:#bbb;min-width:86px}
.sname{font-size:13px;font-weight:600;color:#1a1a1a}
.ssub{font-size:10px;color:#bbb;margin-top:1px}
.shrs{font-size:12px;color:#888;margin-left:auto;white-space:nowrap;font-weight:600}
.empty{text-align:center;padding:40px 20px;color:#ccc;font-size:14px;line-height:1.8}

/* ══ UPLOAD SECTION ══ */
.person-row{display:flex;gap:8px;margin-bottom:14px}
.pb{flex:1;padding:11px;border-radius:12px;border:1.5px solid #eee;background:#f8f8f8;cursor:pointer;font-size:12px;font-weight:700;color:#bbb;font-family:inherit}
.pb.nima-a{background:#EEF2FF;color:#1E2D5A;border-color:#7B9FE8}
.pb.dorsa-a{background:#FFF0E6;color:#C05A1F;border-color:#E8855A}
.upload-box{border:2px dashed #e0e0e0;border-radius:16px;padding:28px 16px;text-align:center;background:#fff;margin-bottom:12px;cursor:pointer}
.upload-box:active{background:#fafafa}
.upload-icon{font-size:36px;display:block;margin-bottom:8px}
.upload-box p{color:#bbb;font-size:13px}
.prev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.prev-wrap{position:relative}
.prev-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:0.5px solid #eee}
.rm-btn{position:absolute;top:3px;right:3px;width:20px;height:20px;background:rgba(0,0,0,0.5);border:none;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.analyze-btn{width:100%;padding:15px;border-radius:14px;border:none;background:#1E2D5A;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-bottom:8px}
.analyze-btn:disabled{background:#b0bcd4;cursor:not-allowed}
.analyze-btn:active:not(:disabled){opacity:0.85}
.status-msg{text-align:center;font-size:12px;color:#aaa;min-height:18px}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="blob-area">
    <div class="blob-purple"></div>
    <div class="blob-yellow2"></div>
    <div class="icon-card">📅</div>
  </div>
  <div class="form-area">
    <div class="app-title">Work Schedule</div>
    <div class="field-group">
      <div class="field-label">Username</div>
      <input class="field-input" id="userInput" type="text" placeholder="Nima or Dorsa" autocomplete="off">
    </div>
    <div class="field-label" style="width:100%;margin-bottom:6px;font-size:12px;color:#888;font-weight:500">Password</div>
    <div class="pw-wrap">
      <input type="password" id="pinInput" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')checkPin()">
      <button class="eye-btn" onclick="togglePw()" id="eyeBtn">👁</button>
    </div>
    <button class="login-btn" onclick="checkPin()">Login</button>
    <p class="lock-err" id="lockErr"></p>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none;position:fixed;inset:0;display:none;flex-direction:column">

  <div class="topbar">
    <h1>📅 Work Schedule</h1>
    <span class="topbar-sub">Nima & Dorsa</span>
  </div>

  <!-- CALENDAR SECTION -->
  <div class="main-content" id="content-calendar" style="display:block">
    <div style="height:10px"></div>
    <div class="stats">
      <div class="stat"><div class="stat-l">Nima shifts</div><div class="stat-v nv" id="nimaS">–</div></div>
      <div class="stat"><div class="stat-l">Nima hours</div><div class="stat-v nv" id="nimaH">–</div></div>
      <div class="stat"><div class="stat-l">Dorsa shifts</div><div class="stat-v dv" id="dorsaS">–</div></div>
      <div class="stat"><div class="stat-l">Dorsa hours</div><div class="stat-v dv" id="dorsaH">–</div></div>
    </div>
    <div class="legend">
      <div class="li"><div class="ld" style="background:#3D5FBF"></div>Nima (Walmart)</div>
      <div class="li"><div class="ld" style="background:#C05A1F"></div>Dorsa (TJX)</div>
      <div class="li"><div class="ld" style="background:#1A7A48"></div>Day off</div>
    </div>
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-t" id="monthTitle"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="section-lbl">Shift details</div>
    <div class="shift-list" id="shiftList"></div>
  </div>

  <!-- UPLOAD SECTION -->
  <div class="main-content" id="content-upload" style="display:none">
    <div style="height:10px"></div>
    <div class="person-row">
      <button class="pb nima-a" id="btn-nima" onclick="selectPerson('nima')">Nima (Walmart)</button>
      <button class="pb" id="btn-dorsa" onclick="selectPerson('dorsa')">Dorsa (TJX)</button>
    </div>
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <span class="upload-icon">☁️</span>
      <p>Tap to upload schedule screenshots</p>
      <p style="font-size:11px;margin-top:4px;color:#ccc">Multiple images supported</p>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">
    </div>
    <div class="prev-grid" id="previewGrid"></div>
    <button class="analyze-btn" id="analyzeBtn" onclick="analyzeImages()" disabled>🤖 Analyze Schedule</button>
    <p class="status-msg" id="statusMsg"></p>
    <div style="height:20px"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nb active" id="nav-calendar" onclick="showSection('calendar')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Calendar
    </button>
    <button class="nb" id="nav-upload" onclick="showSection('upload')">
      <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
      Upload
    </button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://izapleohuqtsvbyjsdgn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6YXBsZW9odXF0c3ZieWpzZGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4Mjk2NTMsImV4cCI6MjA5NzQwNTY1M30.qhjHhZ8jaWe5eZqIPdmQOH6vQSBiXJykB1QpaiOGZug';
const APP_PIN = '2580';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DNAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DHDR = ['Su','Mo','Tu','We','Th','Fr','Sa'];

let state = {
  person: 'nima',
  month: new Date().getMonth(),
  year: new Date().getFullYear(),
  schedules: { nima: {}, dorsa: {} },
  images: { nima: [], dorsa: [] }
};

function togglePw() {
  const i = document.getElementById('pinInput');
  i.type = i.type === 'password' ? 'text' : 'password';
}

function checkPin() {
  const pin = document.getElementById('pinInput').value;
  const err = document.getElementById('lockErr');
  if (pin === APP_PIN) {
    document.getElementById('lockScreen').style.display = 'none';
    const app = document.getElementById('mainApp');
    app.style.display = 'flex';
    loadFromDB();
    renderCalendar();
  } else {
    err.textContent = 'Wrong password. Try again.';
    setTimeout(() => err.textContent = '', 2500);
  }
}

function showSection(s) {
  document.getElementById('content-calendar').style.display = s === 'calendar' ? 'block' : 'none';
  document.getElementById('content-upload').style.display = s === 'upload' ? 'block' : 'none';
  document.getElementById('nav-calendar').classList.toggle('active', s === 'calendar');
  document.getElementById('nav-upload').classList.toggle('active', s === 'upload');
  if (s === 'calendar') renderCalendar();
}

function selectPerson(p) {
  state.person = p;
  document.getElementById('btn-nima').className = 'pb' + (p === 'nima' ? ' nima-a' : '');
  document.getElementById('btn-dorsa').className = 'pb' + (p === 'dorsa' ? ' dorsa-a' : '');
  renderPreviews();
}

function handleFiles(e) {
  Array.from(e.target.files).forEach(f => {
    const r = new FileReader();
    r.onload = ev => {
      state.images[state.person].push(ev.target.result);
      renderPreviews();
      document.getElementById('analyzeBtn').disabled = false;
    };
    r.readAsDataURL(f);
  });
  e.target.value = '';
}

function renderPreviews() {
  const g = document.getElementById('previewGrid');
  g.innerHTML = '';
  state.images[state.person].forEach((src, i) => {
    const w = document.createElement('div'); w.className = 'prev-wrap';
    const img = document.createElement('img'); img.src = src; img.className = 'prev-img';
    const btn = document.createElement('button'); btn.className = 'rm-btn'; btn.textContent = '✕';
    btn.onclick = () => { state.images[state.person].splice(i, 1); renderPreviews(); checkAnalyzeBtn(); };
    w.appendChild(img); w.appendChild(btn); g.appendChild(w);
  });
}

function checkAnalyzeBtn() {
  const total = state.images.nima.length + state.images.dorsa.length;
  document.getElementById('analyzeBtn').disabled = total === 0;
}

async function analyzeImages() {
  const btn = document.getElementById('analyzeBtn');
  const status = document.getElementById('statusMsg');
  btn.disabled = true;
  const persons = ['nima', 'dorsa'].filter(p => state.images[p].length > 0);
  if (!persons.length) { btn.disabled = false; return; }

  for (const person of persons) {
    const label = person === 'nima' ? 'Nima (Walmart)' : 'Dorsa (TJX)';
    const store = person === 'nima' ? 'Walmart' : 'TJX/Marshalls/HomeGoods';
    status.textContent = 'Analyzing ' + label + '...';

    const parts = state.images[person].map(src => ({
      type: 'image',
      source: { type: 'base64', media_type: src.split(';')[0].split(':')[1], data: src.split(',')[1] }
    }));
    parts.push({
      type: 'text',
      text: `These are work schedule screenshots for ${person === 'nima' ? 'Nima' : 'Dorsa'} at ${store}.
Extract ALL shifts shown. If the same date appears in multiple images, keep the most accurate one.
Return ONLY valid JSON, no markdown, no explanation:
{"shifts":[{"date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","hours":8,"isOff":false,"note":""}]}
For days off set isOff:true and hours:0. Use 24-hour time format.`
    });

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 2000, messages: [{ role: 'user', content: parts }] })
      });
      const data = await res.json();
      const raw = data.content.filter(b => b.type === 'text').map(b => b.text).join('').replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(raw);

      for (const s of parsed.shifts) {
        await sb.from('shifts').upsert({
          person, date: s.date, start_time: s.start, end_time: s.end,
          hours: s.hours || 0, is_off: s.isOff || false, note: s.note || ''
        }, { onConflict: 'person,date' });
      }
      status.textContent = label + ': ' + parsed.shifts.length + ' entries saved ✓';
      state.images[person] = [];
    } catch (err) {
      status.textContent = 'Error: ' + err.message;
    }
  }

  renderPreviews();
  checkAnalyzeBtn();
  await loadFromDB();
  setTimeout(() => showSection('calendar'), 800);
}

async function loadFromDB() {
  const { data } = await sb.from('shifts').select('*');
  state.schedules = { nima: {}, dorsa: {} };
  if (data) data.forEach(r => {
    if (!state.schedules[r.person]) state.schedules[r.person] = {};
    state.schedules[r.person][r.date] = { start: r.start_time, end: r.end_time, hours: r.hours, isOff: r.is_off, note: r.note };
  });
  renderCalendar();
}

function changeMonth(d) {
  state.month += d;
  if (state.month > 11) { state.month = 0; state.year++; }
  if (state.month < 0) { state.month = 11; state.year--; }
  renderCalendar();
}

function renderCalendar() {
  const { month: m, year: y } = state;
  document.getElementById('monthTitle').textContent = MONTHS[m] + ' ' + y;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  DHDR.forEach(d => { const h = document.createElement('div'); h.className = 'dh'; h.textContent = d; grid.appendChild(h); });

  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const prev = new Date(y, m, 0).getDate();
  const today = new Date();
  let nimaS = 0, nimaH = 0, dorsaS = 0, dorsaH = 0;

  for (let i = 0; i < first; i++) {
    const c = document.createElement('div'); c.className = 'dc other';
    const n = document.createElement('div'); n.className = 'dn'; n.textContent = prev - first + 1 + i; c.appendChild(n); grid.appendChild(c);
  }

  for (let d = 1; d <= days; d++) {
    const c = document.createElement('div'); c.className = 'dc';
    const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    if (today.getFullYear() === y && today.getMonth() === m && today.getDate() === d) c.classList.add('today');
    const n = document.createElement('div'); n.className = 'dn'; n.textContent = d; c.appendChild(n);

    const nd = state.schedules.nima?.[ds];
    const dd = state.schedules.dorsa?.[ds];
    if (nd) { const p = document.createElement('div'); p.className = nd.isOff ? 'pill op' : 'pill np'; p.textContent = nd.isOff ? 'N:off' : 'N:' + nd.start; c.appendChild(p); if (!nd.isOff) { nimaS++; nimaH += parseFloat(nd.hours) || 0; } }
    if (dd) { const p = document.createElement('div'); p.className = dd.isOff ? 'pill op' : 'pill dp'; p.textContent = dd.isOff ? 'D:off' : 'D:' + dd.start; c.appendChild(p); if (!dd.isOff) { dorsaS++; dorsaH += parseFloat(dd.hours) || 0; } }
    grid.appendChild(c);
  }

  document.getElementById('nimaS').textContent = nimaS || '–';
  document.getElementById('nimaH').textContent = nimaH ? (Math.round(nimaH * 10) / 10) + 'h' : '–';
  document.getElementById('dorsaS').textContent = dorsaS || '–';
  document.getElementById('dorsaH').textContent = dorsaH ? (Math.round(dorsaH * 10) / 10) + 'h' : '–';
  renderShiftList(m, y, days);
}

function renderShiftList(m, y, days) {
  const list = document.getElementById('shiftList');
  const items = [];
  for (let d = 1; d <= days; d++) {
    const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const lbl = DNAMES[new Date(y, m, d).getDay()] + ', ' + MONTHS[m].slice(0, 3) + ' ' + d;
    const nd = state.schedules.nima?.[ds];
    const dd = state.schedules.dorsa?.[ds];
    if (nd || dd) items.push({ lbl, nd, dd });
  }
  if (!items.length) { list.innerHTML = '<div class="empty">No shifts this month.<br>Upload screenshots to get started.</div>'; return; }
  list.innerHTML = '';
  items.forEach(it => {
    if (it.nd && !it.nd.isOff) { const e = document.createElement('div'); e.className = 'si'; e.innerHTML = `<div class="si-icon ni-bg">🏪</div><div style="flex:1"><div class="sname">Nima — Walmart</div><div class="ssub">${it.lbl}</div></div><div class="shrs">${it.nd.start}–${it.nd.end} &nbsp;${it.nd.hours}h</div>`; list.appendChild(e); }
    if (it.dd && !it.dd.isOff) { const e = document.createElement('div'); e.className = 'si'; e.innerHTML = `<div class="si-icon di-bg">🛍️</div><div style="flex:1"><div class="sname">Dorsa — TJX</div><div class="ssub">${it.lbl}</div></div><div class="shrs">${it.dd.start}–${it.dd.end} &nbsp;${it.dd.hours}h</div>`; list.appendChild(e); }
    if (it.nd && it.nd.isOff) { const e = document.createElement('div'); e.className = 'si'; e.innerHTML = `<div class="si-icon oi-bg">🌿</div><div style="flex:1"><div class="sname">Nima — Day off</div><div class="ssub">${it.lbl}</div></div><div class="shrs">–</div>`; list.appendChild(e); }
    if (it.dd && it.dd.isOff) { const e = document.createElement('div'); e.className = 'si'; e.innerHTML = `<div class="si-icon oi-bg">🌿</div><div style="flex:1"><div class="sname">Dorsa — Day off</div><div class="ssub">${it.lbl}</div></div><div class="shrs">–</div>`; list.appendChild(e); }
  });
}
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/work-schedule/sw.js")}</script>
