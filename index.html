<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2D1F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Work Schedule">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Work Schedule — Nima & Dorsa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#2D1F5E}

/* ══ LOCK ══ */
#lockScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:#fff;overflow:auto}
.blob-area{position:relative;height:42%;min-height:200px;background:#F5C842;overflow:hidden;flex-shrink:0}
.blob-purple{position:absolute;top:-15%;right:-10%;width:55%;padding-top:55%;background:#5B5BD6;border-radius:50%}
.blob-yellow2{position:absolute;bottom:-30%;left:-8%;width:50%;padding-top:50%;background:#F5C842;border-radius:50%}
.icon-card{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);width:64px;height:64px;background:#fff;border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,0.13);display:flex;align-items:center;justify-content:center;font-size:32px;z-index:5}
.form-area{flex:1;background:#fff;padding:52px 32px 40px;display:flex;flex-direction:column;align-items:center}
.app-title{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:28px}
.field-group{width:100%;margin-bottom:14px}
.field-label{font-size:12px;color:#888;margin-bottom:6px;font-weight:500;display:block}
.field-input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #ebebeb;font-size:16px;color:#1a1a1a;background:#fafafa;outline:none;-webkit-appearance:none}
.field-input:focus{border-color:#5B5BD6}
.pw-wrap{position:relative;width:100%;margin-bottom:24px}
.pw-wrap input{width:100%;padding:14px 44px 14px 16px;border-radius:14px;border:1.5px solid #ebebeb;font-size:16px;color:#1a1a1a;background:#fafafa;outline:none;-webkit-appearance:none}
.pw-wrap input:focus{border-color:#5B5BD6}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;font-size:18px;color:#bbb;padding:4px}
.login-btn{width:100%;padding:15px;border-radius:14px;border:none;background:#1E2D5A;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.login-btn:active{opacity:0.85}
.lock-err{color:#e24b4a;font-size:13px;margin-top:10px;min-height:18px;text-align:center}

/* ══ MAIN APP ══ */
#mainApp{display:none;position:fixed;inset:0;flex-direction:column;background:#2D1F5E}

/* ══ CAL HEADER (dark) ══ */
.cal-header{background:#2D1F5E;padding:16px 20px 0;flex-shrink:0;padding-top:max(16px,env(safe-area-inset-top))}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.menu-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.menu-btn span{width:16px;height:2px;background:rgba(255,255,255,0.7);border-radius:2px;display:block}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#E8855A,#c0635a);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-nav h2{color:#fff;font-size:26px;font-weight:800}
.nav-arrows{display:flex;gap:6px}
.nav-arr{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.7);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-days-hdr{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.dh{text-align:center;font-size:10px;color:rgba(255,255,255,0.35);font-weight:600;padding:2px 0}
.cal-grid-dark{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding-bottom:12px}
.dc{min-height:44px;display:flex;flex-direction:column;align-items:center;padding:3px 1px;border-radius:8px}
.dc.other .dn{color:rgba(255,255,255,0.2)}
.dc.today .dn{background:#E8855A;color:#fff;border-radius:50%}
.dn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:rgba(255,255,255,0.85);margin-bottom:2px}
.dots{display:flex;gap:2px;justify-content:center}
.dot{width:5px;height:5px;border-radius:50%}
.ndot{background:#7B9FE8}
.ddot{background:#E8855A}
.odot{background:#5EBF8A}

/* ══ BOTTOM WHITE CARD ══ */
.bottom-card{background:#fff;border-radius:28px 28px 0 0;flex:1;display:flex;flex-direction:column;overflow:hidden}
.card-handle{width:36px;height:4px;background:#eee;border-radius:2px;margin:12px auto 8px}
.card-scroll{flex:1;overflow-y:auto;padding:0 16px;-webkit-overflow-scrolling:touch}
.card-title{font-size:18px;font-weight:800;color:#1a1a1a;margin-bottom:14px}
.shift-items{display:flex;flex-direction:column;gap:0}
.si{display:flex;align-items:center;gap:12px;padding:12px 0}
.si+.si{border-top:1px solid #f5f5f5}
.si-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.ni-bg{background:#EEF2FF}
.di-bg{background:#FFF0E6}
.oi-bg{background:#EDFAF3}
.si-info{flex:1}
.si-name{font-size:13px;font-weight:700;color:#1a1a1a}
.si-time{font-size:11px;color:#aaa;margin-top:2px}
.si-badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}
.badge-nima{background:#EEF2FF;color:#3D5FBF}
.badge-dorsa{background:#FFF0E6;color:#C05A1F}
.badge-off{background:#EDFAF3;color:#1A7A48}

/* ══ STATS (in card) ══ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:#f8f8f8;border-radius:12px;padding:10px 12px;text-align:center}
.stat-l{font-size:10px;color:#aaa;margin-bottom:3px;font-weight:500}
.stat-v{font-size:20px;font-weight:800}
.nv{color:#1E2D5A}.dv{color:#C05A1F}
.legend{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#777}
.ld{width:8px;height:8px;border-radius:50%}

/* ══ BOTTOM NAV ══ */
.bottom-nav{background:#fff;border-top:1px solid #f0f0f0;display:flex;flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.nb{flex:1;padding:10px 0 6px;border:none;background:transparent;cursor:pointer;font-size:10px;color:#bbb;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.active{color:#2D1F5E}

/* ══ UPLOAD (also dark header + white card) ══ */
.upload-header{background:#2D1F5E;padding:16px 20px 20px;flex-shrink:0;padding-top:max(16px,env(safe-area-inset-top))}
.upload-header h2{color:#fff;font-size:22px;font-weight:800;margin-bottom:4px}
.upload-header p{color:rgba(255,255,255,0.45);font-size:13px}
.upload-card{background:#fff;border-radius:28px 28px 0 0;flex:1;overflow-y:auto;padding:20px 20px 0;-webkit-overflow-scrolling:touch}
.person-row{display:flex;gap:8px;margin-bottom:14px}
.pb{flex:1;padding:11px;border-radius:12px;border:1.5px solid #eee;background:#f8f8f8;cursor:pointer;font-size:13px;font-weight:700;color:#bbb;font-family:inherit}
.pb.nima-a{background:#EEF2FF;color:#1E2D5A;border-color:#7B9FE8}
.pb.dorsa-a{background:#FFF0E6;color:#C05A1F;border-color:#E8855A}
.upload-box{border:2px dashed #e0e0e0;border-radius:16px;padding:28px 16px;text-align:center;background:#fafafa;margin-bottom:12px;cursor:pointer}
.upload-icon{font-size:36px;display:block;margin-bottom:8px}
.upload-box p{color:#bbb;font-size:13px}
.prev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.prev-wrap{position:relative}
.prev-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:0.5px solid #eee}
.rm-btn{position:absolute;top:3px;right:3px;width:22px;height:22px;background:rgba(0,0,0,0.55);border:none;border-radius:50%;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.analyze-btn{width:100%;padding:15px;border-radius:14px;border:none;background:#1E2D5A;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px}
.analyze-btn:disabled{background:#b0bcd4;cursor:not-allowed}
.analyze-btn:active:not(:disabled){opacity:0.85}
.status-msg{text-align:center;font-size:12px;color:#aaa;min-height:18px;padding-bottom:20px}

/* sections */
#sec-calendar{display:none;flex-direction:column;flex:1;overflow:hidden}
#sec-upload{display:none;flex-direction:column;flex:1;overflow:hidden}
#sec-calendar.active,#sec-upload.active{display:flex}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lockScreen">
  <div class="blob-area">
    <div class="blob-purple"></div>
    <div class="blob-yellow2"></div>
    <div class="icon-card">📅</div>
  </div>
  <div class="form-area">
    <div class="app-title">Work Schedule</div>
    <div class="field-group">
      <label class="field-label">Username</label>
      <input class="field-input" id="userInput" type="text" placeholder="Nima or Dorsa" autocomplete="off" autocorrect="off" autocapitalize="off">
    </div>
    <label class="field-label" style="width:100%;margin-bottom:6px">Password</label>
    <div class="pw-wrap">
      <input type="password" id="pinInput" placeholder="••••••••" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" onkeydown="if(event.key==='Enter')checkPin()">
      <button class="eye-btn" onclick="togglePw()">👁</button>
    </div>
    <button class="login-btn" onclick="checkPin()">Login</button>
    <p class="lock-err" id="lockErr"></p>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">

  <!-- CALENDAR -->
  <div id="sec-calendar" class="active">
    <div class="cal-header">
      <div class="topbar-row">
        <div class="menu-btn"><span></span><span></span><span></span></div>
        <div class="avatar" id="avatarLetter">N</div>
      </div>
      <div class="month-nav">
        <h2 id="monthTitle">June 2026</h2>
        <div class="nav-arrows">
          <button class="nav-arr" onclick="changeMonth(-1)">‹</button>
          <button class="nav-arr" onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="cal-days-hdr">
        <div class="dh">Su</div><div class="dh">Mo</div><div class="dh">Tu</div><div class="dh">We</div><div class="dh">Th</div><div class="dh">Fr</div><div class="dh">Sa</div>
      </div>
      <div class="cal-grid-dark" id="calGrid"></div>
    </div>
    <div class="bottom-card">
      <div class="card-handle"></div>
      <div class="card-scroll">
        <div class="stats">
          <div class="stat"><div class="stat-l">Nima shifts</div><div class="stat-v nv" id="nimaS">–</div></div>
          <div class="stat"><div class="stat-l">Nima hours</div><div class="stat-v nv" id="nimaH">–</div></div>
          <div class="stat"><div class="stat-l">Dorsa shifts</div><div class="stat-v dv" id="dorsaS">–</div></div>
          <div class="stat"><div class="stat-l">Dorsa hours</div><div class="stat-v dv" id="dorsaH">–</div></div>
        </div>
        <div class="legend">
          <div class="li"><div class="ld" style="background:#7B9FE8"></div>Nima (Walmart)</div>
          <div class="li"><div class="ld" style="background:#E8855A"></div>Dorsa (TJX)</div>
          <div class="li"><div class="ld" style="background:#5EBF8A"></div>Day off</div>
        </div>
        <div class="card-title" id="cardTitle">Shifts this month</div>
        <div class="shift-items" id="shiftList"></div>
        <div style="height:20px"></div>
      </div>
      <nav class="bottom-nav">
        <button class="nb active" id="nav-calendar" onclick="showSection('calendar')">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar
        </button>
        <button class="nb" id="nav-upload" onclick="showSection('upload')">
          <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>Upload
        </button>
      </nav>
    </div>
  </div>

  <!-- UPLOAD -->
  <div id="sec-upload">
    <div class="upload-header">
      <div class="topbar-row" style="margin-bottom:8px">
        <div class="menu-btn"><span></span><span></span><span></span></div>
        <div class="avatar" id="avatarLetter2">N</div>
      </div>
      <h2>Upload Schedule</h2>
      <p>Add screenshots to analyze</p>
    </div>
    <div class="upload-card">
      <div class="person-row">
        <button class="pb nima-a" id="btn-nima" onclick="selectPerson('nima')">Nima (Walmart)</button>
        <button class="pb" id="btn-dorsa" onclick="selectPerson('dorsa')">Dorsa (TJX)</button>
      </div>
      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <span class="upload-icon">☁️</span>
        <p>Tap to upload schedule screenshots</p>
        <p style="font-size:11px;margin-top:4px;color:#ccc">Multiple images supported</p>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">
      </div>
      <div class="prev-grid" id="previewGrid"></div>
      <button class="analyze-btn" id="analyzeBtn" onclick="analyzeImages()" disabled>🤖 Analyze Schedule</button>
      <p class="status-msg" id="statusMsg"></p>
    </div>
    <nav class="bottom-nav" style="background:#fff;border-top:1px solid #f0f0f0">
      <button class="nb" id="nav-calendar2" onclick="showSection('calendar')">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar
      </button>
      <button class="nb active" id="nav-upload2" onclick="showSection('upload')">
        <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>Upload
      </button>
    </nav>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://izapleohuqtsvbyjsdgn.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6YXBsZW9odXF0c3ZieWpzZGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4Mjk2NTMsImV4cCI6MjA5NzQwNTY1M30.qhjHhZ8jaWe5eZqIPdmQOH6vQSBiXJykB1QpaiOGZug';
const APP_PIN='2580';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DNAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let state={person:'nima',month:new Date().getMonth(),year:new Date().getFullYear(),schedules:{nima:{},dorsa:{}},images:{nima:[],dorsa:[]}};

function togglePw(){const i=document.getElementById('pinInput');i.type=i.type==='password'?'text':'password';}

function checkPin(){
  const pin=document.getElementById('pinInput').value;
  const err=document.getElementById('lockErr');
  if(pin===APP_PIN){
    document.getElementById('lockScreen').style.display='none';
    const app=document.getElementById('mainApp');
    app.style.display='flex';app.style.flexDirection='column';app.style.position='fixed';app.style.inset='0';
    loadFromDB();renderCalendar();
  } else {
    err.textContent='Wrong password. Try again.';
    setTimeout(()=>err.textContent='',2500);
  }
}

function showSection(s){
  document.getElementById('sec-calendar').classList.toggle('active',s==='calendar');
  document.getElementById('sec-upload').classList.toggle('active',s==='upload');
  ['nav-calendar','nav-calendar2'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.toggle('active',s==='calendar');});
  ['nav-upload','nav-upload2'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.toggle('active',s==='upload');});
  if(s==='calendar')renderCalendar();
}

function selectPerson(p){
  state.person=p;
  document.getElementById('btn-nima').className='pb'+(p==='nima'?' nima-a':'');
  document.getElementById('btn-dorsa').className='pb'+(p==='dorsa'?' dorsa-a':'');
  ['avatarLetter','avatarLetter2'].forEach(id=>document.getElementById(id).textContent=p==='nima'?'N':'D');
  renderPreviews();
}

function handleFiles(e){
  Array.from(e.target.files).forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{state.images[state.person].push(ev.target.result);renderPreviews();document.getElementById('analyzeBtn').disabled=false;};
    r.readAsDataURL(f);
  });
  e.target.value='';
}

function renderPreviews(){
  const g=document.getElementById('previewGrid');g.innerHTML='';
  state.images[state.person].forEach((src,i)=>{
    const w=document.createElement('div');w.className='prev-wrap';
    const img=document.createElement('img');img.src=src;img.className='prev-img';
    const btn=document.createElement('button');btn.className='rm-btn';btn.textContent='✕';
    btn.onclick=()=>{state.images[state.person].splice(i,1);renderPreviews();const t=state.images.nima.length+state.images.dorsa.length;document.getElementById('analyzeBtn').disabled=t===0;};
    w.appendChild(img);w.appendChild(btn);g.appendChild(w);
  });
}

async function analyzeImages(){
  const btn=document.getElementById('analyzeBtn');
  const status=document.getElementById('statusMsg');
  btn.disabled=true;
  const persons=['nima','dorsa'].filter(p=>state.images[p].length>0);
  if(!persons.length){btn.disabled=false;return;}

  for(const person of persons){
    const label=person==='nima'?'Nima (Walmart)':'Dorsa (TJX)';
    const store=person==='nima'?'Walmart':'TJX/Marshalls/HomeGoods';
    status.textContent='Analyzing '+label+'...';
    const parts=state.images[person].map(src=>({type:'image',source:{type:'base64',media_type:src.split(';')[0].split(':')[1],data:src.split(',')[1]}}));
    parts.push({type:'text',text:`These are work schedule screenshots for ${person==='nima'?'Nima':'Dorsa'} at ${store}. Extract ALL shifts. If same date appears multiple times keep most accurate. Return ONLY valid JSON no markdown:\n{"shifts":[{"date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","hours":8,"isOff":false,"note":""}]}\nFor days off: isOff:true, hours:0. Use 24h format.`});
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:parts}]})});
      const data=await res.json();
      const raw=data.content.filter(b=>b.type==='text').map(b=>b.text).join('').replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(raw);
      for(const s of parsed.shifts){
        await sb.from('shifts').upsert({person,date:s.date,start_time:s.start,end_time:s.end,hours:s.hours||0,is_off:s.isOff||false,note:s.note||''},{onConflict:'person,date'});
      }
      status.textContent=label+': '+parsed.shifts.length+' entries saved ✓';
      state.images[person]=[];
    }catch(err){status.textContent='Error: '+err.message;}
  }
  renderPreviews();
  document.getElementById('analyzeBtn').disabled=true;
  await loadFromDB();
  setTimeout(()=>showSection('calendar'),800);
}

async function loadFromDB(){
  const{data}=await sb.from('shifts').select('*');
  state.schedules={nima:{},dorsa:{}};
  if(data)data.forEach(r=>{if(!state.schedules[r.person])state.schedules[r.person]={};state.schedules[r.person][r.date]={start:r.start_time,end:r.end_time,hours:r.hours,isOff:r.is_off,note:r.note};});
  renderCalendar();
}

function changeMonth(d){
  state.month+=d;
  if(state.month>11){state.month=0;state.year++;}
  if(state.month<0){state.month=11;state.year--;}
  renderCalendar();
}

function renderCalendar(){
  const{month:m,year:y}=state;
  document.getElementById('monthTitle').textContent=MONTHS[m]+' '+y;
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prev=new Date(y,m,0).getDate();
  const today=new Date();
  let nimaS=0,nimaH=0,dorsaS=0,dorsaH=0;

  for(let i=0;i<first;i++){const c=document.createElement('div');c.className='dc other';const n=document.createElement('div');n.className='dn';n.textContent=prev-first+1+i;c.appendChild(n);grid.appendChild(c);}

  for(let d=1;d<=days;d++){
    const c=document.createElement('div');c.className='dc';
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d)c.classList.add('today');
    const n=document.createElement('div');n.className='dn';n.textContent=d;c.appendChild(n);
    const nd=state.schedules.nima?.[ds];
    const dd=state.schedules.dorsa?.[ds];
    const dots=document.createElement('div');dots.className='dots';
    if(nd){const dot=document.createElement('div');dot.className='dot '+(nd.isOff?'odot':'ndot');dots.appendChild(dot);if(!nd.isOff){nimaS++;nimaH+=parseFloat(nd.hours)||0;}}
    if(dd){const dot=document.createElement('div');dot.className='dot '+(dd.isOff?'odot':'ddot');dots.appendChild(dot);if(!dd.isOff){dorsaS++;dorsaH+=parseFloat(dd.hours)||0;}}
    if(nd||dd)c.appendChild(dots);
    grid.appendChild(c);
  }

  document.getElementById('nimaS').textContent=nimaS||'–';
  document.getElementById('nimaH').textContent=nimaH?(Math.round(nimaH*10)/10)+'h':'–';
  document.getElementById('dorsaS').textContent=dorsaS||'–';
  document.getElementById('dorsaH').textContent=dorsaH?(Math.round(dorsaH*10)/10)+'h':'–';
  renderShiftList(m,y,days);
}

function renderShiftList(m,y,days){
  const list=document.getElementById('shiftList');
  const today=new Date();
  const isThisMonth=today.getFullYear()===y&&today.getMonth()===m;
  if(isThisMonth){
    document.getElementById('cardTitle').textContent='Today — '+DNAMES[today.getDay()]+' '+MONTHS[m].slice(0,3)+' '+today.getDate();
  } else {
    document.getElementById('cardTitle').textContent='Shifts — '+MONTHS[m];
  }
  const items=[];
  for(let d=1;d<=days;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const lbl=DNAMES[new Date(y,m,d).getDay()]+', '+MONTHS[m].slice(0,3)+' '+d;
    const nd=state.schedules.nima?.[ds];
    const dd=state.schedules.dorsa?.[ds];
    if(nd||dd)items.push({lbl,nd,dd});
  }
  if(!items.length){list.innerHTML='<div style="text-align:center;padding:30px 0;color:#ccc;font-size:14px">No shifts this month.<br>Upload screenshots to get started.</div>';return;}
  list.innerHTML='';
  items.forEach(it=>{
    if(it.nd&&!it.nd.isOff){const e=document.createElement('div');e.className='si';e.innerHTML=`<div class="si-icon ni-bg">🏪</div><div class="si-info"><div class="si-name">Nima — Walmart</div><div class="si-time">${it.lbl} &nbsp;·&nbsp; ${it.nd.start}–${it.nd.end}</div></div><div class="si-badge badge-nima">${it.nd.hours}h</div>`;list.appendChild(e);}
    if(it.dd&&!it.dd.isOff){const e=document.createElement('div');e.className='si';e.innerHTML=`<div class="si-icon di-bg">🛍️</div><div class="si-info"><div class="si-name">Dorsa — TJX</div><div class="si-time">${it.lbl} &nbsp;·&nbsp; ${it.dd.start}–${it.dd.end}</div></div><div class="si-badge badge-dorsa">${it.dd.hours}h</div>`;list.appendChild(e);}
    if(it.nd&&it.nd.isOff){const e=document.createElement('div');e.className='si';e.innerHTML=`<div class="si-icon oi-bg">🌿</div><div class="si-info"><div class="si-name">Nima — Day off</div><div class="si-time">${it.lbl}</div></div><div class="si-badge badge-off">Off</div>`;list.appendChild(e);}
    if(it.dd&&it.dd.isOff){const e=document.createElement('div');e.className='si';e.innerHTML=`<div class="si-icon oi-bg">🌿</div><div class="si-info"><div class="si-name">Dorsa — Day off</div><div class="si-time">${it.lbl}</div></div><div class="si-badge badge-off">Off</div>`;list.appendChild(e);}
  });
}
</script>
</body>
</html>
